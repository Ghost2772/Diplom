name: mullers-firearms-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weapon_store
      POSTGRES_USER: weapon_store
      POSTGRES_PASSWORD: weapon_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weapon_store -d weapon_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://weapon_store:weapon_store@db:5432/weapon_store
      SECRET_KEY: local-development-key-change-before-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
      PRODUCT_UPLOAD_DIR: /app/uploads/products
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - product_uploads:/app/uploads
volumes:
  postgres_data:
  product_uploads:
