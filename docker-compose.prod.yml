name: mullers-firearms-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weapon_store}
      POSTGRES_USER: ${POSTGRES_USER:-weapon_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./weapon-store-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      SQL_ECHO: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-weapon_store}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-weapon_store}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
      ROOT_PATH: /api
      # Only Nginx can reach the unpublished API from outside the Docker network.
      FORWARDED_ALLOW_IPS: "*"
      DB_WAIT_MAX_ATTEMPTS: ${DB_WAIT_MAX_ATTEMPTS:-30}
      DB_WAIT_DELAY_SECONDS: ${DB_WAIT_DELAY_SECONDS:-2}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://api.giga.chat/v1/chat/completions}
      GIGACHAT_VERIFY_SSL: "true"
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
      PRODUCT_UPLOAD_DIR: /app/uploads/products
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      DEMO_SESSION_MINUTES: ${DEMO_SESSION_MINUTES:-60}
      DEMO_MAX_SESSIONS: ${DEMO_MAX_SESSIONS:-100}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?Set DEMO_ADMIN_EMAIL in .env.production}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env.production}
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./weapon-store-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  product_uploads:
  caddy_data:
  caddy_config:
