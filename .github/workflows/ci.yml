name: CI

on:
  push:
    branches: [main, portfolio-rework]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: weapon_store
          POSTGRES_USER: weapon_store
          POSTGRES_PASSWORD: weapon_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weapon_store -d weapon_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: weapon-store-backend
    env:
      DATABASE_URL: postgresql+asyncpg://weapon_store:weapon_store@localhost:5432/weapon_store
      SECRET_KEY: ci-only-secret
      GIGACHAT_AUTH_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: weapon-store-backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: alembic upgrade head
      - run: SEED_DEMO_DATA=true python -m app.seed
      - run: python -m pytest
      - run: alembic upgrade head --sql > /tmp/mullers-firearms-schema.sql
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weapon-store-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: weapon-store-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    env:
      DOMAIN: demo.example.com
      ACME_EMAIL: ci@example.com
      SECRET_KEY: ci-only-deployment-secret-not-for-a-public-server
      POSTGRES_PASSWORD: ci_only_database_password
      DEMO_ADMIN_PASSWORD: ci_only_admin_password
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - name: Validate Caddy
        run: >-
          docker run --rm --env DOMAIN --env ACME_EMAIL
          -v "$PWD/deploy/caddy:/etc/caddy:ro"
          caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate production Nginx
        run: >-
          docker run --rm --add-host backend:127.0.0.1
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.28-alpine nginx -t
