# These keys deliberately share a budget across all visitors of this small demo.
# GET /auth/demo (button configuration) and chat history are not rate limited.
map "$request_method:$uri" $auth_budget {
    default "";
    ~^POST:/api/auth/(login|register|demo)/?$ "public-auth";
}

map "$request_method:$uri" $chat_budget {
    default "";
    ~^POST:/api/ai/chat/?$ "public-chat";
}

limit_req_zone $auth_budget zone=auth:1m rate=30r/m;
limit_req_zone $chat_budget zone=chat:1m rate=10r/m;

# The production frontend is reachable only through Caddy's Docker network.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=auth burst=5 nodelay;
    limit_req zone=chat burst=2 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Слишком много запросов, попробуйте через 10 секунд"}';
    }

    location /api/ {
        client_max_body_size 9m;
        proxy_read_timeout 120s;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
